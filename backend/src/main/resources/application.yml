spring:
  application:
    name: jobpilot-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/jobpilot}
    username: ${DATABASE_USER:jobpilot}
    password: ${DATABASE_PASSWORD:jobpilot}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

jobpilot:
  # Required. At least 32 characters. Generate one: openssl rand -base64 48
  jwt-secret: ${JWT_SECRET}
  jwt-ttl-hours: ${JWT_TTL_HOURS:24}
  storage-dir: ${STORAGE_DIR:./data/resumes}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  # Optional: Adzuna job search (free key at https://developer.adzuna.com). Without it only followed company boards are used.
  adzuna-app-id: ${ADZUNA_APP_ID:}
  adzuna-app-key: ${ADZUNA_APP_KEY:}
  adzuna-country: ${ADZUNA_COUNTRY:in}
  # Background discovery for every user (Spring cron; "-" disables it).
  discovery-cron: ${DISCOVERY_CRON:0 0 */6 * * *}
  # Local LLM used by the apply agent for open-ended questions ("Why do you want to join?"). Optional.
  ollama-url: ${OLLAMA_URL:http://localhost:11434}
  ollama-model: ${OLLAMA_MODEL:qwen2.5:3b-instruct}
