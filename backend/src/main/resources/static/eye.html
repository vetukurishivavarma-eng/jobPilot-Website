<!doctype html>
<!-- Eye-contact coach for the mobile app's WebView: face tracking runs on the phone, video never leaves it.
     Posts "away" / "back" / "ready" / "error" to the app. Same rule as the web app: no face, or head turned
     sideways, for 2+ seconds = away; looking down (typing) doesn't count. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
</style>
</head>
<body>
<video id="v" muted playsinline autoplay></video>
<script type="module">
const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'
const post = m => window.ReactNativeWebView ? window.ReactNativeWebView.postMessage(m) : console.log(m)
try {
  const v = document.getElementById('v')
  v.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 320, height: 240 } })
  await v.play()
  const { FaceLandmarker, FilesetResolver } = await import(`${VISION}/vision_bundle.mjs`)
  const lm = await FaceLandmarker.createFromOptions(await FilesetResolver.forVisionTasks(`${VISION}/wasm`),
    { baseOptions: { modelAssetPath: MODEL }, runningMode: 'VIDEO', numFaces: 1 })
  post('ready')
  let since = 0, away = false
  const tick = () => {
    const f = lm.detectForVideo(v, performance.now()).faceLandmarks?.[0]
    let off = !f
    if (f) { // nose tip vs the midpoint of the outer eye corners, in eye-widths
      const l = f[33], r = f[263], nose = f[1]
      off = Math.abs((nose.x - (l.x + r.x) / 2) / Math.max(Math.abs(r.x - l.x), 0.01)) > 0.35
    }
    const now = Date.now()
    if (!off) { since = 0; if (away) { away = false; post('back') } }
    else if (!since) since = now
    else if (now - since > 2000 && !away) { away = true; post('away') }
    setTimeout(tick, 250)
  }
  tick()
} catch (e) { post('error') }
</script>
</body>
</html>
