# Render's free plan sleeps after 15 idle minutes and a cold start takes ~75 s.
# ponytail: GitHub cron can run late and pauses after 60 days of no repo activity; UptimeRobot (5-min ping) if that bites.
name: keep-awake
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 120 https://jobpilot-api-gpa6.onrender.com/actuator/health
